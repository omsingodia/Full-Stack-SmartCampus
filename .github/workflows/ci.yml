name: CampusCare CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client
        working-directory: client
        run: npm install
      - name: Build client
        working-directory: client
        run: npm run build
      - name: Install server
        working-directory: server
        run: npm install
      - name: Run server tests
        working-directory: server
        run: npm test
